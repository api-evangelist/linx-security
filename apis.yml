aid: linx-security
name: Linx Security
description: 'Linx Security is an AI-native identity security and governance platform that unifies identity
  visibility, governance, and enforcement across human, non-human, and AI agent identities. The platform
  spans modern Identity Governance and Administration (IGA), Identity Security Posture Management (ISPM),
  just-in-time access, identity lifecycle management, and agentic identity governance, built on a graph-based
  identity fabric with AI-driven analytics, automation, and remediation. Linx also ships an MCP Gateway
  and an MCP Server that give AI agents governed, audited access to identity data and actions. The company
  was founded by Israel Duanis and Niv Goldenberg, emerged from stealth with $33M in funding, and has
  since raised a $50M Series B. The product is delivered as gated enterprise SaaS at app.linxsecurity.io;
  no public API documentation or developer portal is published at this time.'
